version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../backend:/workspace/backend
    ports:
      - "8000:8000"
    command: python /workspace/backend/src/main.py

  frontend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../frontend:/workspace/frontend
    ports:
      - "3000:3000"
    command: npm start --prefix /workspace/frontend

  nginx:
    image: nginx:latest
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend